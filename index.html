<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poseidon IoT | Smart Monitor</title>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <style>
        :root {
            --primary: #3b82f6;
            --bg: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --text: #f1f5f9;
            --accent-green: #10b981;
            --accent-red: #ef4444;
            --accent-amber: #f59e0b;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            background-image: radial-gradient(circle at 50% 50%, #1e293b 0%, #0f172a 100%);
            color: var(--text);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        h1 {
            font-weight: 800;
            letter-spacing: -0.025em;
            margin-bottom: 30px;
            background: linear-gradient(to right, #60a5fa, #3b82f6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 2.5rem;
        }

        .dashboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            width: 100%;
            max-width: 1000px;
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 30px;
            text-align: center;
            transition: transform 0.3s ease, border-color 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
            border-color: var(--primary);
        }

        h2 {
            font-size: 0.875rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: #94a3b8;
            margin-top: 0;
        }

        .value {
            font-size: 3rem;
            font-weight: 800;
            margin: 10px 0;
            transition: color 0.5s ease;
        }

        /* Water Tank Visual */
        .tank-container {
            width: 80px;
            height: 120px;
            border: 3px solid #475569;
            border-radius: 12px;
            margin: 0 auto 15px;
            position: relative;
            overflow: hidden;
            background: #1e293b;
        }

        .water {
            position: absolute;
            bottom: 0;
            width: 100%;
            background: linear-gradient(180deg, #60a5fa 0%, #2563eb 100%);
            transition: height 1s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.5);
        }

        /* Badges */
        .badge {
            display: inline-flex;
            align-items: center;
            padding: 6px 16px;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 700;
            margin-top: 10px;
        }

        .available { background: rgba(16, 185, 129, 0.2); color: var(--accent-green); }
        .booked { background: rgba(239, 68, 68, 0.2); color: var(--accent-red); }
        .processing { 
            background: rgba(245, 158, 11, 0.2); color: var(--accent-amber);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse { 50% { opacity: 0.5; } }

        .footer-info {
            margin-top: auto;
            padding: 20px;
            color: #64748b;
            font-size: 0.875rem;
        }
    </style>
</head>
<body>

    <h1>POSEIDON <span style="font-weight:300">IoT</span></h1>

    <div class="dashboard">
        <!-- Device Info -->
        <div class="card">
            <h2>Device Identity</h2>
            <div id="id" class="value" style="font-size: 1.5rem; margin-top: 45px;">--</div>
            <div id="last_seen" style="font-size: 0.75rem; color: #64748b; margin-top: 10px;">Waiting for connection...</div>
        </div>

        <!-- Level Card with Visual Tank -->
        <div class="card">
            <h2>Water Level</h2>
            <div class="tank-container">
                <div id="water_fill" class="water" style="height: 0%"></div>
            </div>
            <div><span id="w_lvl" class="value">--</span><span style="font-size: 1.5rem; color: #64748b;">%</span></div>
        </div>

        <!-- Booking Card -->
        <div class="card">
            <h2>Supply Status</h2>
            <div id="booking_text" class="value">READY</div>
            <div id="booking_badge" class="badge available">Available</div>
        </div>
    </div>

    <div class="footer-info">
        Server V1.2.3 • Real-time encrypted stream
    </div>

    <script>
        const socket = io();
        let lastState = null;
        let isAnimating = false;

        const sleep = ms => new Promise(r => setTimeout(r, ms));

        async function runBookingSequence() {
            if (isAnimating) return;
            isAnimating = true;

            const text = document.getElementById('booking_text');
            const badge = document.getElementById('booking_badge');

            const stages = ["INITIATING", "SEARCHING", "CONFIRMING", "EN ROUTE"];
            for (const s of stages) {
                if (lastState === 0) break;
                text.innerText = s;
                text.style.color = "var(--accent-amber)";
                badge.innerText = "Processing...";
                badge.className = "badge processing";
                await sleep(1500);
            }

            if (lastState === 1) {
                text.innerText = "BOOKED";
                text.style.color = "var(--accent-red)";
                badge.innerText = "Tanker Occupied";
                badge.className = "badge booked";
            }
            isAnimating = false;
        }

        socket.on('updateDashboard', (data) => {
            console.log("Stream:", data);

            // Update ID & Timestamp
            if (data.id) document.getElementById('id').innerText = data.id;
            document.getElementById('last_seen').innerText = "Last Update: " + new Date().toLocaleTimeString();

            // Update Water Level and Tank Visual
            if (data.w_lvl !== undefined) {
                const lvl = parseFloat(data.w_lvl);
                document.getElementById('w_lvl').innerText = lvl;
                document.getElementById('water_fill').style.height = lvl + "%";
            }

            // Update Booking State
            if (data.booking !== undefined) {
                const newState = parseInt(data.booking);
                if (newState !== lastState) {
                    lastState = newState;
                    if (newState === 1) {
                        runBookingSequence();
                    } else {
                        const text = document.getElementById('booking_text');
                        const badge = document.getElementById('booking_badge');
                        text.innerText = "READY";
                        text.style.color = "var(--accent-green)";
                        badge.innerText = "Available";
                        badge.className = "badge available";
                    }
                }
            }
        });
    </script>
</body>
</html>
