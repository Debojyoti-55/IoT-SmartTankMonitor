<!DOCTYPE html>
<html>
<head>
    <title>Poseidon Water Level Monitor</title>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; text-align: center; background: #e0e7ff; margin: 0; padding: 20px; }
        .container { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; }
        .card { background: white; padding: 25px; width: 250px; border-radius: 15px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); border-top: 5px solid #3b82f6; }
        h2 { color: #0e2871; font-size: 1.2rem; margin-bottom: 10px; }
        .value { font-size: 2.2em; font-weight: 800; color: #002d80; transition: all 0.5s ease; }
        .unit { font-size: 1.2em; color: #64748b; }
        
        .status-badge { margin-top: 10px; display: inline-block; padding: 5px 15px; border-radius: 20px; font-size: 0.8rem; font-weight: bold; text-transform: uppercase; transition: all 0.3s; }
        .booked { background: #fee2e2; color: #991b1b; }
        .available { background: #d1fae5; color: #065f46; }
        .processing { background: #fef3c7; color: #92400e; border: 1px dashed #d97706; animation: pulse 1s infinite; }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.6; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body>
    <h1>Real-Time Water Monitor</h1>
    <div class="container">
        <div class="card">
            <h2>Device Status</h2>
            <div id="id" class="value">--</div>
        </div>

        <div class="card">
            <h2>Water Level</h2>
            <div><span id="w_lvl" class="value">--</span><span id="unit" class="unit">%</span></div>
        </div>

        <div class="card">
            <h2>Booking</h2>
            <div id="booking_text" class="value">OPEN</div>
            <div id="booking_badge" class="status-badge available">Tanker Available</div>
        </div>
    </div>

    <script>
        const socket = io(); 
        
        // GLOBAL STATE TRACKERS
        let currentBookingState = 0; 
        let animationActive = false;

        const delay = ms => new Promise(res => setTimeout(res, ms));

        async function runBookingSequence() {
            if (animationActive) return;
            animationActive = true;

            const text = document.getElementById('booking_text');
            const badge = document.getElementById('booking_badge');

            const stages = ["INITIATING...", "FINDING TANKER", "BOOKING...", "BOOKED!"];
            const desc = ["Process Initiated", "Searching Fleet", "Finalizing Order", "On the Way"];

            for (let i = 0; i <=1; i++) {
                // If the state was reset to 0 by a new packet during animation, abort immediately
                if (currentBookingState === 0) {
                    resetToOpen();
                    animationActive = false;
                    return;
                }

                text.innerText = stages[i];
                text.style.color = "#d97706"; 
                badge.innerText = desc[i];
                badge.className = "status-badge processing";
                await delay(2000);
            }

            // Final check after loops finish
            if (currentBookingState === 1) {
                text.innerText = "BOOKED";
                text.style.color = "#dc2626";
                badge.innerText = "On the Way";
                badge.className = "status-badge booked";
            }
            animationActive = false;
        }

        function resetToOpen() {
            const text = document.getElementById('booking_text');
            const badge = document.getElementById('booking_badge');
            text.innerText = "OPEN";
            text.style.color = "#059669";
            badge.innerText = "Tanker Available";
            badge.className = "status-badge available";
        }

        function getDynamicColor(pct) {
            pct = Math.max(10, Math.min(100, pct));
            let r, g, b = 0;
            if (pct >= 50) {
                let ratio = (pct - 50) / 50;
                r = Math.floor(255 * (1 - ratio));
                g = 255;
            } else if (pct >= 25) {
                let ratio = (pct - 25) / 25;
                r = 255;
                g = Math.floor(165 + (90 * ratio));
            } else {
                let ratio = (pct - 10) / 15;
                r = 255;
                g = Math.floor(165 * ratio);
            }
            return `rgb(${r}, ${g}, ${b})`;
        }

        socket.on('updateDashboard', (data) => {
            console.log("Incoming Data:", data);

            // Update ID and Water Level (These can update constantly without issue)
            if (data.id) document.getElementById('id').innerText = data.id;
            if (data.w_lvl !== undefined) {
                const el = document.getElementById('w_lvl');
                el.innerText = data.w_lvl;
                el.style.color = getDynamicColor(parseFloat(data.w_lvl));
            }

            // BOOKING LOGIC
            if (data.booking !== undefined) {
                const incomingState = parseInt(data.booking);

                // Check if the state actually changed
                if (incomingState !== currentBookingState) {
                    console.log(`STATE CHANGE DETECTED: ${currentBookingState} -> ${incomingState}`);
                    currentBookingState = incomingState;

                    if (incomingState === 1) {
                        runBookingSequence();
                    } else {
                        resetToOpen();
                    }
                }
            }
        });
    </script>
</body>
</html>
